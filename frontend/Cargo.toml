[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common", features = ["client-side"] }
async-channel = "2.5.0"
base64 = "0.23.1"
color-eyre = "0.6.5"
console_error_panic_hook = "0.1.7"
futures-util = "0.3.34"
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-worker = { version = "0.6.0", features = ["futures"] }
icondata = "0.7.0"
leptos = { version = "0.8.20", features = ["csr"] }
leptos-use = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["wasm-bindgen"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-web = "0.1.3"
typst = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
  "embedded-fonts",
] }
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = [
  "XmlHttpRequest",
  "XmlHttpRequestResponseType",
] }
web-time = "1.1.0"
gloo-net = "0.7.0"
serde_json = "1.0.151"
leptos_router = "0.8.15"
futures = "0.3.34"
tar = "0.4.46"
js-sys = "0.3.104"
typst-assets = { version = "0.15.1", features = ["fonts"] }
gloo-storage = "0.4.0"
uuid = { version = "1.24.1", features = ["v4", "js"] }
wasm-bindgen-futures = "0.4.77"
lopdf = { version = "0.44.0", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
typst-layout = "0.15.1"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
