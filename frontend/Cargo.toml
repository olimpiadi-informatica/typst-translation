[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
base64 = "0.22.1"
color-eyre = "0.6.5"
console_error_panic_hook = "0.1.7"
futures-util = "0.3.31"
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-worker = { version = "0.5.0", features = ["futures"] }
icondata = "0.6.0"
leptos = { version = "0.8.6", features = ["csr"] }
leptos-use = "0.16.2"
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
thaw = { version = "0.5.0-beta", features = ["csr"] }
time = { version = "0.3.41", features = ["wasm-bindgen"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-web = "0.1.3"
typst = "0.13.1"
typst-kit = { version = "0.13.1", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "0.13.1"
typst-svg = "0.13.1"
wasm-bindgen = "0.2.100"
web-sys = "0.3.77"
